version: '3.8'

services:
  frontend-builder:
    build:
      context: ./vue-across
    volumes:
      - ./vue-across/dist:/app/dist  # output path
    command: [ "echo", "build complete" ]  # dummy run, just triggers build
  backend:
    build: ./flask-back
    container_name: flask-backend
    ports:
      - "7143:5000"  # Expose backend (Flask) at port 7143 on host
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mydb
    depends_on:
      - db
    volumes:
      - ./flask-back:/app
      - ./vue-across/dist:/app/frontend/dist  # Serve built Vue app
    networks:
      - app-network

  db:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
