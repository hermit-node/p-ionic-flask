services:
  frontend-builder:
    build:
      context: ./vue-across
    volumes:
      - ./vue-across/dist:/app/dist
    command: ["npm", "run", "build"]

  backend:
    build:
      context: ./flask-back
    container_name: flask-backend
    ports:
      - "7143:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mydb
      FRONTEND_DIST: /app/frontend/dist
    depends_on:
      db:
        condition: service_started
      frontend-builder:
        condition: service_completed_successfully
    volumes:
      - ./flask-back:/app
      - ./vue-across/dist:/app/frontend/dist
    networks:
      - app-network

  db:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
